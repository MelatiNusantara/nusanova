<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Profil Kesiapan AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:wght@400;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: follows the IOE AI Xcelerate course pages — navy header band with a serif title, white body, navy buttons, IOE red for the one main call to action. Colours sampled from learn.ioe-emp.org. */
:root{
  --bg:#ffffff; --surface:#ffffff; --sunk:#f4f5f8; --line:#e2e0db; --fg:#1d203a; --muted:#677176;
  --accent:#1d203a; --accent-ink:#ffffff; --accent-soft:#e6e7f0; --mark:#dd3027; --mark-soft:#fbe3e1;
  --hero:#1d203a; --hero-ink:#ffffff; --hero-muted:#b5bac0; --hero-line:#3a3e5e; --cta:#dd3027; --cta-ink:#ffffff; --brand:#10115d;
  --good:#2f7d3a; --warn:#a86a00; --crit:#b23a2e; --good-soft:#dcefdc; --warn-soft:#f6e7c8; --crit-soft:#f6dcd8;
  --display:"Tinos", "Times New Roman", Times, serif;
  --body:"Roboto", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono:"Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14162b; --surface:#1b1e36; --sunk:#101227; --line:#2e3150; --fg:#e8e9f2; --muted:#a4abb3;
  --accent:#c3c7f0; --accent-ink:#1d203a; --accent-soft:#272b4d; --mark:#f06a61; --mark-soft:#3d1d22;
  --hero:#0d0f22; --hero-ink:#ffffff; --hero-muted:#b5bac0; --hero-line:#2e3150; --cta:#dd3027; --cta-ink:#ffffff; --brand:#c3c7f0;
  --good:#6cc27a; --warn:#e2a93f; --crit:#ef7c6e; --good-soft:#1c3320; --warn-soft:#3a2d12; --crit-soft:#3d1f1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14162b; --surface:#1b1e36; --sunk:#101227; --line:#2e3150; --fg:#e8e9f2; --muted:#a4abb3;
  --accent:#c3c7f0; --accent-ink:#1d203a; --accent-soft:#272b4d; --mark:#f06a61; --mark-soft:#3d1d22;
  --hero:#0d0f22; --hero-ink:#ffffff; --hero-muted:#b5bac0; --hero-line:#2e3150; --cta:#dd3027; --cta-ink:#ffffff; --brand:#c3c7f0;
  --good:#6cc27a; --warn:#e2a93f; --crit:#ef7c6e; --good-soft:#1c3320; --warn-soft:#3a2d12; --crit-soft:#3d1f1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.8rem;font-weight:400;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:1.65rem;font-weight:400}
h3{font-size:1.25rem;font-weight:400}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hero);color:var(--hero-ink)}
.top-in{max-width:1120px;margin:0 auto;padding:1rem 16px .6rem;display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center}
.brand{display:flex;flex-direction:column;gap:.15rem;margin-right:auto;min-width:0}
.brand small{color:var(--hero-muted);font-size:.85rem}
.logos{flex:1 0 100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem 1.5rem;padding-bottom:.6rem;border-bottom:1px solid var(--hero-line);margin-bottom:.2rem}
.logos-main,.logos-tech{display:flex;align-items:center;gap:.6rem 1.1rem;flex-wrap:wrap}
.logo-nus{height:13px;width:auto}
.logo-apindo{height:38px;width:auto}
.logo-ecop{height:38px;width:auto}
.logo-kat{height:22px;width:auto}
.logo-partner{font-family:var(--body);font-weight:700;letter-spacing:.08em;font-size:.9rem;color:var(--hero-ink);border:1px solid var(--hero-line);border-radius:4px;padding:.1rem .45rem}
.logo-label{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--hero-muted)}
.ctrls{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.top .seg{border-color:var(--hero-line);background:transparent}
.seg button{border:0;background:transparent;padding:.3rem .8rem;cursor:pointer;font-size:.9rem;color:var(--muted)}
.top .seg button{color:var(--hero-muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.top .seg button[aria-pressed="true"]{background:var(--hero-ink);color:#1d203a}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.tabs{max-width:1120px;margin:0 auto;padding:0 16px;display:flex;gap:.25rem;overflow-x:auto}
.tabs button{border:0;background:none;padding:.55rem .8rem;border-bottom:3px solid transparent;cursor:pointer;color:var(--hero-muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--hero-ink);border-bottom-color:var(--cta)}

.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:1.25rem 4rem}
.intro{display:flex;flex-direction:column;gap:.4rem;margin-bottom:1.5rem;max-width:68ch}
.intro h2{font-size:2.1rem;color:var(--brand)}
.intro p{color:var(--muted);font-size:1.05rem}
.banner{background:var(--sunk);border:1px solid var(--line);color:var(--fg);border-radius:var(--r);padding:.6rem .9rem;font-size:.92rem;margin-bottom:1.25rem}

.form-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:2rem;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);display:flex;flex-direction:column;gap:.15rem}
.rail button{display:flex;justify-content:space-between;gap:.5rem;text-align:left;border:0;background:none;color:var(--muted);padding:.35rem .6rem;border-radius:var(--r);font-size:.92rem;cursor:pointer;width:100%}
.rail button:hover{background:var(--sunk);color:var(--fg)}
.rail button .num{font-size:.78rem}
.rail button.done{color:var(--fg)}
.rail button.done .num{color:var(--good)}
.rail .sub{display:flex;flex-direction:column;gap:.1rem;margin-left:.6rem;padding-left:.4rem;border-left:1px solid var(--line)}
.rail .sub button{font-size:.86rem;padding:.25rem .5rem}
.rail button.grp.open{color:var(--fg);font-weight:500}
.rail button.cur{background:var(--accent-soft);color:var(--fg);font-weight:500;box-shadow:inset 3px 0 0 var(--cta)}
.fact{margin-top:1.1rem;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);padding:.9rem 1rem;display:flex;flex-direction:column;gap:.45rem}
.fact .fk{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--cta)}
.fact .fb{font-family:var(--display);font-size:2rem;line-height:1;color:var(--brand)}
.fact p{font-size:.92rem;line-height:1.4}
.fact a,.fact .src{font-size:.75rem;color:var(--muted)}
.fact-dots{display:flex;gap:.3rem;margin-top:.15rem}
.fact-dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.fact-dots button[aria-current="true"]{background:var(--brand)}
#factMobile{display:none}
.stepnav{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding-top:1rem;border-top:1px solid var(--line);margin-top:.5rem}
.stepnav .count{margin-left:auto;color:var(--muted);font-size:.88rem}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:.6rem .6rem 0}
.progress i{display:block;height:100%;background:var(--accent);width:0}

section.block{display:flex;flex-direction:column;gap:1rem;padding-block:1.25rem;border-top:1px solid var(--line)}
section.block:first-child{border-top:0;padding-top:0}
.block-head{display:flex;flex-direction:column;gap:.3rem}
.block-head p{color:var(--muted);max-width:65ch}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem 1.25rem}
.field{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.field.wide{grid-column:1/-1}
.field label,.field .lbl{font-weight:600;font-size:.95rem}
.field .hint{color:var(--muted);font-size:.85rem}
input[type=text],input[type=email],input[type=tel],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.5rem .65rem;width:100%}
textarea{min-height:4.5rem;resize:vertical}
.choices{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);border-radius:var(--r);padding:.3rem .75rem;background:var(--surface);cursor:pointer;font-size:.92rem}
.chip input{accent-color:var(--accent);margin:0}
.chip:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

.stmt{display:grid;grid-template-columns:3.2rem minmax(0,1fr);gap:.2rem 1rem;padding:.9rem 0;border-top:1px dashed var(--line)}
.stmt:first-of-type{border-top:0}
.stmt .code{font-family:var(--mono);color:var(--muted);font-size:.9rem;padding-top:.1rem}
.stmt .txt{font-weight:600}
.scale{grid-column:2;display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:.35rem;margin-top:.45rem}
.scale label{display:flex;flex-direction:column;align-items:center;gap:.15rem;border:1px solid var(--line);border-radius:var(--r);padding:.35rem .25rem;cursor:pointer;background:var(--surface);text-align:center;min-width:0}
.scale label b{font-family:var(--mono);font-size:1rem}
.scale label span{font-size:.72rem;color:var(--muted);line-height:1.2}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label:has(input:checked){border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.scale label:has(input:checked) span{color:var(--accent-ink)}
.scale label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.scale label.dk{padding-inline:.6rem}
.dimhead{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}
.dimhead .num{color:var(--muted);font-size:.85rem}

.consent{display:flex;flex-direction:column;gap:.6rem}
.consent label{display:grid;grid-template-columns:auto 2rem minmax(0,1fr);gap:.6rem;align-items:start;border:1px solid var(--line);border-radius:var(--r);padding:.7rem .8rem;background:var(--surface);cursor:pointer}
.consent label .box{font-family:var(--mono);font-weight:500;color:var(--accent)}
.consent input{accent-color:var(--accent);margin-top:.25rem}
.consent small{display:block;color:var(--muted)}

.actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.55rem 1rem;cursor:pointer;font-weight:600}
.btn.primary{background:var(--cta);color:var(--cta-ink);border-color:var(--cta)}
.btn.navy{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:.3rem .65rem;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-loading {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.btn-spinner {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: btn-spin .7s linear infinite;
}

@keyframes btn-spin {
  to { transform: rotate(360deg); }
}

.btn.primary:disabled {
  opacity: .8;
  cursor: wait;
}

@media (prefers-reduced-motion: reduce) {
  .btn-spinner {
    animation: none;
  }
}
.err{color:var(--crit);font-size:.9rem}
.note{color:var(--muted);font-size:.9rem}

/* results */
.score-card{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:1.5rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.4rem}
.dial{display:flex;flex-direction:column;gap:.4rem}
.dial .big{font-family:var(--display);font-size:4.2rem;font-weight:700;color:var(--brand);line-height:1}
.dial .big small{font-size:1.2rem;color:var(--muted);font-weight:500}
.level{display:inline-flex;align-self:flex-start;gap:.4rem;align-items:center;border-radius:999px;padding:.2rem .7rem;font-weight:700;font-size:.9rem;background:var(--accent-soft);color:var(--fg)}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:.4rem}
.ladder i{height:8px;border-radius:2px;background:var(--sunk)}
.ladder i.on{background:var(--accent)}
.bars{display:flex;flex-direction:column;gap:.55rem}
.bar{display:grid;grid-template-columns:minmax(0,12rem) minmax(0,1fr) 3rem;gap:.7rem;align-items:center}
.bar .t{font-size:.92rem}
.bar .track{position:relative;height:12px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar .track i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.bar .track i.weak{background:var(--mark)}
.bar .track .tick{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.bar .v{text-align:right}
.res-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-top:1rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.6rem;min-width:0}
.panel ul{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:.35rem}
.route{display:flex;gap:.6rem;align-items:flex-start}
.pill{display:inline-block;border-radius:999px;padding:.1rem .55rem;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.neutral{background:var(--sunk);color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

/* staff views */
.toolbar{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;margin-bottom:1rem}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:.5rem .7rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);position:sticky;top:0}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.empty{padding:2rem;text-align:center;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem;margin-bottom:1rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem}
.kpi b{display:block;font-family:var(--display);font-size:1.9rem;color:var(--brand)}
.kpi span{color:var(--muted);font-size:.85rem}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;min-width:120px;background:var(--sunk)}
.stack i{display:block;height:100%}
.l1{background:var(--crit)}.l2{background:var(--mark)}.l3{background:var(--accent)}.l4{background:var(--good)}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:.3rem;vertical-align:-1px}
.ins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem;margin-top:1.2rem}
.ins .panel h3{font-size:1.1rem}
.ins .who{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--cta)}
.ins .big{font-family:var(--display);font-size:1.9rem;color:var(--brand);line-height:1}
.ins ul{margin:0;padding-left:1.1rem}
.bar .track .bm{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--cta);border-radius:2px}
@media (max-width:860px){.ins{grid-template-columns:minmax(0,1fr)}}
.dummy-panel{display:flex;flex-wrap:wrap;gap:.8rem 1.2rem;align-items:center;justify-content:space-between;border:1px dashed var(--cta);border-radius:var(--r);background:var(--mark-soft);padding:.8rem 1rem;margin-bottom:1rem}
.dummy-panel p{margin-top:.15rem}
.cfg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.8rem}
details.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.7rem 1rem;margin-bottom:1rem}
details.box summary{cursor:pointer;font-weight:600}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2rem;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.55rem 1rem;border-radius:8px;font-size:.92rem;z-index:20}

@media (max-width:860px){
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  #factMobile{display:flex;margin-top:1rem}
  .score-card,.res-grid{grid-template-columns:minmax(0,1fr)}
  .kpis,.cfg{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .fields{grid-template-columns:minmax(0,1fr)}
  .stmt{grid-template-columns:minmax(0,1fr)}
  .stmt .code{padding:0}
  .scale{grid-column:1;grid-template-columns:repeat(5,minmax(0,1fr))}
  .scale label.dk{grid-column:1/-1;flex-direction:row;justify-content:center}
  .scale label span{display:none}
  .bar{grid-template-columns:minmax(0,1fr) 3rem}
  .bar .t{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


/* =====================================================================
   WIDE RESPONSIVE LAYOUT — visual-only override, no business logic changes
   ===================================================================== */
:root { --page-gutter: clamp(18px, 2.4vw, 48px); }
html { overflow-x: clip; }
body { min-width: 320px; }
.top-in, .tabs, .wrap { max-width: none; width: 100%; margin-inline: auto; padding-inline: var(--page-gutter); }
.top-in { padding-block: 1rem .75rem; }
.tabs { gap: .65rem; }
.tabs button { padding: .75rem 1rem; font-size: 1rem; }
.wrap { padding-top: 1.5rem; padding-bottom: 5rem; }
.intro { max-width: none; margin-bottom: 1.7rem; }
.intro h2 { font-size: clamp(2rem, 2.65vw, 2.85rem); }
.intro p { max-width: 100ch; font-size: 1.06rem; }
.form-grid { grid-template-columns: clamp(220px, 18vw, 290px) minmax(0, 1fr); gap: clamp(22px, 2.4vw, 44px); }
.rail { top: calc(env(safe-area-inset-top,0px) + 165px); }
.rail button { padding-block: .47rem; font-size: .96rem; }
.rail .sub button { font-size: .91rem; }
section.block { padding-block: 1.65rem; gap: 1.2rem; }
.block-head p { max-width: 95ch; }
.stmt { grid-template-columns: 3rem minmax(0, 1fr); column-gap: 1.1rem; padding: 1.25rem 0; }
.stmt .txt { font-size: clamp(.98rem, 1vw, 1.14rem); line-height: 1.45; }
.scale { gap: .55rem; margin-top: .7rem; }
.scale label { min-height: 75px; justify-content: center; padding: .6rem .35rem; }
.scale label b { font-size: 1.12rem; }
.scale label span { font-size: .83rem; }
.scale label.dk { min-width: 90px; }
.fields { gap: 1.15rem 1.5rem; }
.field label,.field .lbl { font-size: 1rem; }
input[type=text],input[type=email],input[type=tel],input[type=number],select,textarea { min-height: 44px; }
.score-card { grid-template-columns: minmax(220px, 25%) minmax(0, 1fr); }
.tablebox { width: 100%; }
@media (min-width: 1600px) {
  .form-grid { grid-template-columns: 290px minmax(0,1fr); }
  .scale label { min-height: 85px; }
  .score-card { gap: 2.3rem; }
}
@media (max-width: 1024px) {
  :root { --page-gutter: 22px; }
  .form-grid { grid-template-columns: 205px minmax(0,1fr); gap: 22px; }
  .scale { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .scale label.dk { min-width: 0; }
  .scale label { min-height: 66px; }
  .scale label span { font-size: .76rem; }
}
@media (max-width: 860px) {
  :root { --page-gutter: 18px; }
  .top-in { gap: .8rem; }
  .form-grid { grid-template-columns: minmax(0,1fr); gap: 0; }
  .rail { display: none; }
  .scale { grid-template-columns: repeat(5,minmax(0,1fr)) auto; }
  .scale label { min-height: 72px; }
  .res-grid,.ins { grid-template-columns: minmax(0,1fr); }
}
@media (max-width: 600px) {
  :root { --page-gutter: 14px; }
  .top-in { padding-top: .8rem; }
  .logos { gap: .65rem; }
  .logos-main,.logos-tech { gap: .6rem; }
  .logo-apindo,.logo-ecop { height: 29px; }
  .logo-kat { height: 19px; }
  .brand { flex: 1 1 100%; }
  .brand h1 { font-size: clamp(1.4rem, 6vw, 1.9rem); }
  .ctrls { width: 100%; justify-content: flex-start; }
  .tabs { gap: .15rem; }
  .tabs button { padding: .7rem .6rem; font-size: .9rem; }
  .wrap { padding-top: 1.1rem; }
  .intro { margin-bottom: 1.2rem; }
  .intro h2 { font-size: 1.75rem; }
  .intro p { font-size: .98rem; }
  .banner { font-size: .85rem; }
  .fields { grid-template-columns: minmax(0,1fr); }
  .stmt { grid-template-columns: minmax(0,1fr); row-gap: .45rem; padding-block: 1.25rem; }
  .stmt .code { font-size: .85rem; }
  .stmt .txt { font-size: 1rem; }
  .scale { grid-column: 1; grid-template-columns: repeat(5,minmax(0,1fr)); gap: .3rem; }
  .scale label { min-height: 58px; padding: .4rem .12rem; }
  .scale label b { font-size: 1.05rem; }
  .scale label span { display: none; }
  .scale label.dk { grid-column: 1/-1; min-height: 42px; flex-direction: row; justify-content: center; }
  .scale label.dk span { display: inline; font-size: .83rem; }
  .stepnav { gap: .5rem; }
  .stepnav .count { flex-basis: 100%; margin-left: 0; }
  .score-card { grid-template-columns: 1fr; padding: 1rem; }
  .kpis,.cfg { grid-template-columns: repeat(2,minmax(0,1fr)); }
  th,td { padding: .55rem; }
}
@media (max-width: 360px) {
  .tabs button { font-size: .81rem; padding-inline: .45rem; }
  .scale { gap: .2rem; }
  .scale label b { font-size: .96rem; }
}
</style>
</head>

<script>
"use strict";
/* ============================================================
   SITE CONFIGURATION — edit these three lines when deploying
   endpoint: the Google Apps Script web app URL (see README).
             Leave "" to run in local demo mode (answers stay in
             each reviewer's own browser only).
   key:      the shared review key, same value as in Code.gs.
   reviewMode: true shows the Program and Index tabs to everyone.
               Set to false before any real pilot.
   ============================================================ */
const CONFIG = {
  // Update alamat ini setelah subdomain API dan HTTPS aktif.
  endpoint: "https://api-ai.nusanova.org/api",
  key: "",
  reviewMode: true
};

/* ---------- storage adapter: Google Apps Script or local demo ---------- */
const Store = (() => {
  const remote = !!CONFIG.endpoint;
  const LS = "pka-demo-";
  const lsGet = (k, d) => { try { const v = localStorage.getItem(LS + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} };
  async function request(action, data) {
    const isGet = data === undefined;
    const url = new URL(CONFIG.endpoint);
    if (isGet) url.searchParams.set("action", action);
    const options = isGet
      ? { method: "GET", cache: "no-store" }
      : {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, data })
        };
    const response = await fetch(url.toString(), options);
    const raw = await response.text();
    let result;
    try { result = JSON.parse(raw); }
    catch { throw new Error("API returned non-JSON response (HTTP " + response.status + ")"); }
    if (!response.ok || !result.ok) {
      throw new Error(result.error || "API request failed (HTTP " + response.status + ")");
    }
    return result.data;
  }
  async function get(action) { return request(action); }
  async function post(action, data) { return request(action, data); }
  return {
    mode: remote ? "shared" : "local",
    async save(id, doc) { if (remote) return post("save", { id, doc }); const all = lsGet("responses", {}); all[id] = doc; lsSet("responses", all); },
    async saveMany(items) { if (remote) return post("saveMany", { items }); const all = lsGet("responses", {}); items.forEach(x => all[x.id] = x.doc); lsSet("responses", all); },
    async clearDummy() { if (remote) return post("clearDummy", {}); const all = lsGet("responses", {}); Object.keys(all).forEach(k => { if (all[k].dummy) delete all[k]; }); lsSet("responses", all); },
    async list() { if (remote) return get("list"); const all = lsGet("responses", {}); return Object.entries(all).map(([id, d]) => ({ ...d, _id: id })); },
    async confirm(id, review) { if (remote) return post("confirm", { id, review }); const all = lsGet("responses", {}); if (all[id]) { all[id].review = review; lsSet("responses", all); } },
    async getConfig() { if (remote) return get("config"); return lsGet("config", null); },
    async setConfig(cfg) { if (remote) return post("config", cfg); lsSet("config", cfg); },
    async getBench() { if (remote) return get("bench"); return lsGet("bench", null); },
    async setBench(b) { if (remote) return post("bench", b); lsSet("bench", b); }
  };
})();
function newId() { return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

/* ---------- scoring (pure) ---------- */
function tierOf(n){ n=Number(n)||0; if(n<=9) return "T1"; if(n<=49) return "T2"; if(n<=199) return "T3"; return "T4"; }
function levelOf(s){ return s<25?1:s<50?2:s<75?3:4; }
function score(form, cfg){
  const dims={}; let dk=0; const vals=[];
  for(const d of DIMS){ let sum=0; for(const it of d.items){ const a=form["q"+it[0]]; if(a==="dk"){dk++; vals.push("dk");} else { sum+=Number(a); vals.push(Number(a)); } } dims[d.id]=sum/16*100; }
  const total = DIMS.reduce((acc,d)=>acc+d.w*dims[d.id],0);
  const level = levelOf(total), tier=tierOf(form.staff);
  const m365biz = ["m365basic","m365std","m365prem"].includes(form.office);
  const tierN = Number(tier.slice(1));
  // Imagine Together: firms that need a roadmap first. Level 2 (25-49), or Level 3+ without a plan (D1 below 50); T2 and above.
  const imagineCrit = (total>=cfg.itMin && total<cfg.scoreMin) || (total>=cfg.scoreMin && dims.D1<50);
  const imagine = tierN>=2 && imagineCrit;
  // Up and coming: under 10 full-time staff but scoring like an Imagine Together firm. Flagged, not excluded; Kation decides.
  const upAndComing = tierN===1 && imagineCrit;
  const lean = upAndComing && ["s","md","l"].includes(form.size);
  const adoption = !imagineCrit && total>=cfg.scoreMin && dims.D2>=cfg.d2Min;
  const routes = {
    capacity: total<cfg.scoreMin || dims.D2<cfg.capD2,
    imagineTogether: imagine,
    upAndComing: upAndComing,
    adoptionReady: adoption,
    kation: adoption || imagine || upAndComing,
    copilotFit: adoption && m365biz && Number(form.daily)>=cfg.copilotUsers,
    neutralPilot: (adoption || imagine || upAndComing) && !m365biz,
    facility: form.i1==="yes" && ["audited","unaudited"].includes(form.i4) && form.years && form.years!=="lt2" && form.legal && form.legal!=="sole" && (total>=cfg.scoreMin || dims.D1>=50)
  };
  const flags=[]; if(dk>6) flags.push("dk"); if(vals.every(v=>v===vals[0])) flags.push("lowEffort"); if(dims.D6<25) flags.push("d6"); if(lean) flags.push("lean");
  const order = DIMS.map(d=>d.id).sort((a,b)=>dims[a]-dims[b]);
  return {dims, total:Math.round(total*10)/10, level, tier, routes, flags, dk, weakest:order.slice(0,2)};
}

function readForm(){
  const fd = new FormData($("#f")); const f={};
  for(const [k,v] of fd.entries()){ if(k==="i6"){ (f.i6=f.i6||[]).push(v); } else f[k]=v; }
  f.agree = fd.has("agree"); f.test = fd.has("test");
  if(!f.i6) f.i6=[];
  return f;
}
function bindForm(){
  const form=$("#f");
  form.addEventListener("input",()=>{ S.form=readForm(); $("#i1dWrap").hidden = S.form.i1!=="yes"; updateProgress(); });
  form.addEventListener("change",()=>{ S.form=readForm(); $("#i1dWrap").hidden = S.form.i1!=="yes"; updateProgress(); });
  form.addEventListener("submit",e=>{ e.preventDefault(); submit(); });
  $("#exampleBtn").addEventListener("click",fillExample);
  $("#backBtn").addEventListener("click",()=>goStep(S.step-1));
  $("#nextBtn").addEventListener("click",()=>goStep(S.step+1));
  document.querySelectorAll(".rail [data-go]").forEach(b=>b.addEventListener("click",()=>goStep(Number(b.dataset.go))));
  renderFact();
}
function goStep(n){

function factsFor(step){

    };
    // Gunakan ID yang sama hanya untuk retry submission gagal.
const submissionId = S.lastId || newId();
S.lastId = submissionId;

console.log("[ASSESSMENT] Submitting", {

});

try {

    <div class="tablebox"><table><thead><tr><th>Country</th><th>Tier</th><th class="r">n</th><th>Status</th><th class="r">Mean score</th><th>Level mix</th>${DIMS.map(d=>`<th class="r">${d.id}</th>`).join("")}</tr></thead><tbody>
    ${cells.map(({ct,tr,g})=>{ const n=g.length, st=status(n), show=n>=c.internalMin; const dm=dimMean(g); const mix=[1,2,3,4].map(l=>g.filter(r=>r.scores.level===l).length);
      return `<tr><td>${ct==="ID"?"Indonesia":"Philippines"}</td><td>${tr} · ${tierName[tr][0]}</td><td class="r num">${n}</td><td><span class="pill ${st[0]}">${st[1]}</span></td>
      <td class="r num">${show?(g.reduce((a,r)=>a+r.scores.total,0)/n).toFixed(1):"—"}</td>
      <td>${show?`<span class="stack" role="img" aria-label="Levels: ${mix.join(", ")}">${mix.map((m,i)=>m?`<i class="l${i+1}" style="width:${m/n*100}%"></i>`:"").join("")}</span>`:"—"}</td>
      ${dm.map(v=>`<td class="r num">${show&&v!==null?v.toFixed(0):"—"}</td>`).join("")}</tr>`; }).join("")}
    </tbody></table></div>
    <p class="note" style="margin-top:.8rem">Participants come mostly through employer-association networks and opt in, so these figures describe program participants, not all SMEs. A national edition needs a quota sample.</p>
    ${renderInsights(rows)}
    <div class="panel" style="margin-top:1rem"><h3>Benchmark shown to participants</h3>
      <p class="note">Participants never see other firms' answers. When you publish, only country × tier averages from cells with ${c.publishMin}+ responses are copied to a public summary, which participants' results pages compare against.${CONFIG.reviewMode?" Review mode: test and dummy entries are included when \"Include test entries\" is ticked in the Program view.":" Test entries are always excluded."}</p>
      <p class="note">${S.bench?`Last published ${esc(String(S.bench.updatedAt).slice(0,16).replace("T"," "))} · ${Object.keys(S.bench.cells||{}).length} cell(s)`:"Not published yet."}</p>
      <div class="actions"><button class="btn small navy" id="pubBench" type="button">Publish benchmark now</button></div>
    </div>`;
  const pb=$("#pubBench"); if(pb) pb.onclick=publishBench; bindDummy($("#viewIndex"));
}
function moe(n){ return n? 1.96*Math.sqrt(.25/n)*100 : null; }
function sd(a){ if(a.length<2) return 0; const m=a.reduce((x,y)=>x+y,0)/a.length; return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1)); }
function pct(a,b){ return b? Math.round(a/b*100) : 0; }
function renderInsights(rows){
  const n=rows.length; if(!n) return `<div class="empty">Insights appear here once responses come in.</div>`;
  const scores=rows.map(r=>r.scores.total), m=scores.reduce((a,b)=>a+b,0)/n, s1=sd(scores);
  const byC = ct => rows.filter(r=>r.country===ct);
  const weakest = {}; rows.forEach(r=>{ const d=Object.entries(r.scores.dims).sort((a,b)=>a[1]-b[1])[0][0]; weakest[d]=(weakest[d]||0)+1; });
  const topWeak = Object.entries(weakest).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const dimM = DIMS.map(d=>[d.id,d.en,rows.reduce((a,r)=>a+r.scores.dims[d.id],0)/n]);
  const noRules = rows.filter(r=>{ const v=r.answers?.["6_2"]; return v===0||v===1||v==="dk"; }).length;
  const pledges = rows.reduce((a,r)=>a+(r.profile?.pledge||0),0);
  const route = k => rows.filter(r=>r.routes?.[k]).length;
  const m365 = rows.filter(r=>["m365basic","m365std","m365prem","m365other"].includes(r.profile?.office)).length;
  const gws = rows.filter(r=>r.profile?.office==="gws").length;
  const proj = rows.filter(r=>r.invest?.i1==="yes"); const weakBooks = proj.filter(r=>["books","none"].includes(r.invest?.i4)).length;
  const costBands = OPT.cost.map(o=>[o[1], proj.filter(r=>r.invest?.i2===o[0]).length]).filter(x=>x[1]);
  const w = rows.filter(r=>r.profile?.women==="yes"), nw = rows.filter(r=>r.profile?.women==="no");
  const mean = g => g.length? g.reduce((a,r)=>a+r.scores.total,0)/g.length : 0;
  const capShare = pct(route("capacity"),n);
  const calib = capShare>70?["warn","Over 70% land in capacity building: the 50-point threshold may be too high for this population, or readiness is lower than assumed."]:capShare<20?["warn","Under 20% land in capacity building: check whether the threshold is too low."]:["good","Route mix looks balanced; keep the v1 thresholds."];
  return `<h3 style="margin-top:1.6rem">Insights · ${n} verified responses</h3>
  <p class="note">Precision at this size: shares ±${moe(n).toFixed(0)} points, mean score ±${(1.96*s1/Math.sqrt(n)).toFixed(1)} points (95%). Indonesia n=${byC("ID").length}, Philippines n=${byC("PH").length}.</p>
  <div class="ins">
    <div class="panel"><span class="who">IOE · APINDO · ECOP</span><h3>Where firms get stuck</h3>
      <p>Most common weakest area: ${topWeak.map(([d,c])=>`<b>${d}</b> ${pct(c,n)}%`).join(" · ")}</p>
      <ul>${dimM.map(([id,en,v])=>`<li>${id} ${esc(en)}: <span class="num">${v.toFixed(0)}</span></li>`).join("")}</ul></div>
    <div class="panel"><span class="who">IOE · Nusanova</span><h3>Learner pipeline</h3>
      <span class="big num">${pledges.toLocaleString("en")}</span><p>learners pledged, ${pct(pledges,25000)}% of the 25,000 target · ${(pledges/n).toFixed(1)} per firm</p></div>
    <div class="panel"><span class="who">APINDO · ECOP · regulators</span><h3>Governance gap</h3>
      <span class="big num">${pct(noRules,n)}%</span><p>have no clear rules (or don't know) on what data staff may put into AI tools (statement 6.2).</p></div>
    <div class="panel"><span class="who">Kation</span><h3>Pipeline mix</h3>
      <ul><li>Imagine Together: <span class="num">${route("imagineTogether")}</span></li><li>Up and coming: <span class="num">${route("upAndComing")}</span> (lean: ${rows.filter(r=>(r.flags||[]).includes("lean")).length})</li><li>Adoption: <span class="num">${route("adoptionReady")}</span> · Copilot-fit <span class="num">${route("copilotFit")}</span></li><li>On Microsoft 365: ${pct(m365,n)}% · Google Workspace: ${pct(gws,n)}%</li></ul></div>
    <div class="panel"><span class="who">Nusanova facility</span><h3>Financing demand</h3>
      <p><b class="num">${proj.length}</b> firms (${pct(proj.length,n)}%) have a defined AI or digital project; <b class="num">${route("facility")}</b> meet the facility rules.</p>
      <ul>${costBands.map(([b,c])=>`<li>${esc(b)}: <span class="num">${c}</span></li>`).join("")||"<li>No cost bands yet</li>"}</ul>
      <p class="note">Bankability gap: ${pct(weakBooks,proj.length)}% of firms with a project keep only basic books or none.</p></div>
    <div class="panel"><span class="who">Government · DFIs</span><h3>Inclusion</h3>
      <p>Women-owned or led: ${w.length>=30&&nw.length>=30?`<span class="num">${mean(w).toFixed(1)}</span> vs <span class="num">${mean(nw).toFixed(1)}</span> for others`:`needs 30+ in each group (now ${w.length} and ${nw.length})`}.</p>
      <p class="note">Change over time needs repeat respondents in later rounds.</p></div>
    <div class="panel" style="grid-column:1/-1"><span class="who">Program team</span><h3>Threshold check</h3>
      <p><span class="pill ${calib[0]}">${capShare}% in capacity building</span> ${esc(calib[1])}</p></div>
  </div>`;
}
async function publishBench(){
  const useTests = CONFIG.reviewMode && PF.tests;
  const c=S.cfg, rows=S.rows.filter(r=>(useTests||!r.test) && !(r.flags||[]).includes("lowEffort"));
  const cells={};
  for(const ct of ["ID","PH"]) for(const tr of ["T1","T2","T3","T4"]){ const g=rows.filter(r=>r.country===ct&&r.scores.tier===tr); if(g.length>=c.publishMin){ cells[ct+"_"+tr]={n:g.length, mean:Math.round(g.reduce((a,r)=>a+r.scores.total,0)/g.length*10)/10, dims:Object.fromEntries(DIMS.map(d=>[d.id,Math.round(g.reduce((a,r)=>a+r.scores.dims[d.id],0)/g.length*10)/10]))}; } }
  try{ const b={updatedAt:new Date().toISOString(), minN:c.publishMin, cells}; await Store.setBench(b); S.bench=b; renderIndex(); toast(Object.keys(cells).length?"Benchmark published":"Published, but no cell has enough responses yet"); }
  catch(e){ toast("Could not publish the benchmark."); }
}

}

$("#cID").onclick=()=>{ S.country="ID"; savePrefs(); rerenderAll(); };
$("#cPH").onclick=()=>{ S.country="PH"; S.lang="en"; savePrefs(); rerenderAll(); };

$("#tabAssess").onclick=()=>show(S.result&&!$("#viewResult").hidden?"result":"assess");

$("#tabIndex").onclick=()=>{ renderIndex(); show("index"); };

renderChrome(); renderAssess(); show("assess");

/* ---------- synthetic test data (review only) ---------- */
function makeDummies(n){
  let seed=Date.now()%2147483647||7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const gauss=()=>{ let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  const pick=(arr,w)=>{ let x=rnd()*w.reduce((a,b)=>a+b,0); for(let i=0;i<arr.length;i++){ x-=w[i]; if(x<=0) return arr[i]; } return arr[arr.length-1]; };
  const offset={D1:-.2,D2:.3,D3:-.1,D4:.1,D5:-.1,D6:-.4}; // assumed pattern, synthetic only
  const items=[];
  for(let i=0;i<n;i++){
    const country=rnd()<.5?"ID":"PH";
    const tier=pick(["T1","T2","T3","T4"],[40,35,20,5]);
    const staff={T1:1+Math.floor(rnd()*9),T2:10+Math.floor(rnd()*40),T3:50+Math.floor(rnd()*150),T4:200+Math.floor(rnd()*101)}[tier];
    const latent=Math.max(0,Math.min(4,1.8+gauss()*.7+({T1:-.3,T2:0,T3:.3,T4:.5}[tier])));
    const f={staff:String(staff), staffC:String(Math.floor(rnd()*staff*.4)), daily:String(Math.max(1,Math.round(staff*(.3+rnd()*.6)))),
      office:pick(["none","m365basic","m365std","m365prem","gws","other"],[25,10,20,8,27,10]), size:pick(["m","s","md","l"],{T1:[80,18,2,0],T2:[35,50,13,2],T3:[5,45,40,10],T4:[0,15,45,40]}[tier]),
      legal:pick(["sole","partner","corp","coop"],[35,15,45,5]), years:pick(["lt2","2-5","6-10","gt10"],[12,30,30,28]),
      i1:rnd()<.3?"yes":"no", i4:pick(["audited","unaudited","books","none"],[12,30,45,13])};
    for(const d of DIMS) d.items.forEach(it=>{ const v=Math.round(latent+offset[d.id]+gauss()*.8); f["q"+it[0]]= rnd()<.03?"dk":String(Math.max(0,Math.min(4,v))); });
    const r=score(f,S.cfg);
    const doc={v:1, submittedAt:new Date(Date.now()-Math.floor(rnd()*30)*864e5).toISOString(), country, lang:country==="PH"?"en":"id", test:true, dummy:true,
      profile:{company:"Dummy "+String(i+1).padStart(3,"0"), region:country==="PH"?PH_REG[Math.floor(rnd()*PH_REG.length)]:ID_PROV[Math.floor(rnd()*ID_PROV.length)], sector:SECTORS[Math.floor(rnd()*SECTORS.length)][0], legal:f.legal, years:f.years, staff, staffC:Number(f.staffC), size:f.size, daily:Number(f.daily), office:f.office, pledge:Math.floor(rnd()*Math.min(12,staff+1)), women:rnd()<.3?"yes":"no", exports:rnd()<.15?"yes":"no", member:rnd()<.7?"yes":"no", role:"owner"},
      answers:Object.fromEntries(DIMS.flatMap(d=>d.items.map(it=>[it[0].replace(".","_"), f["q"+it[0]]==="dk"?"dk":Number(f["q"+it[0]])]))),
      invest:{i1:f.i1, i1d:f.i1==="yes"?"Dummy project":"", i2:f.i1==="yes"?pick(["lt5","5-25","25-100","100-500","gt500"],[35,35,20,8,2]):"", i3:"", i4:f.i4, i5:"", i6:[]},
      contact:{name:"Dummy", email:"dummy@example.com", phone:""}, consent:{agreed:true, text:"dummy", lang:"en"},
      scores:{dims:Object.fromEntries(Object.entries(r.dims).map(([k,v])=>[k,Math.round(v*10)/10])), total:r.total, level:r.level, tier:r.tier, dk:r.dk},
      routes:r.routes, flags:r.flags, review:{status:"pending"}};
    items.push({id:"d"+Date.now().toString(36)+i.toString(36)+Math.floor(rnd()*1e6).toString(36), doc});
  }
  return items;
}
function dummyPanel(){
  if(!CONFIG.reviewMode) return "";
  const nd=S.rows.filter(r=>r.dummy).length;
  return `<div class="dummy-panel"><div><b>Test data</b><p class="note">${nd?`${nd} dummy responses loaded. They are synthetic, for previewing the index only.`:"Fill the index with 300 synthetic firms to see what it looks like at pilot scale."}</p></div>
    <div class="actions"><button class="btn primary js-dummy" type="button">Add 300 dummy responses</button>${nd?`<button class="btn js-clear" type="button">Remove dummy responses</button>`:""}</div></div>`;
}
function bindDummy(root){ root.querySelectorAll(".js-dummy").forEach(b=>b.onclick=()=>addDummies(b)); root.querySelectorAll(".js-clear").forEach(b=>b.onclick=clearDummies); }
async function addDummies(btn){
  const b=btn; if(b){ b.disabled=true; b.textContent="Adding…"; }
  try{ const items=makeDummies(300); for(let i=0;i<items.length;i+=100){ await Store.saveMany(items.slice(i,i+100)); } toast("300 dummy responses added"); PF.tests=true; await refreshRows(); }
  catch(e){ toast("Could not add dummy responses."); if(b){ b.disabled=false; b.textContent="Add 300 dummy responses"; } }
}
async function clearDummies(){
  try{ await Store.clearDummy(); toast("Dummy responses removed"); await refreshRows(); }catch(e){ toast("Could not remove dummy responses."); }
}

/* ---------- data loading ---------- */
async function refreshRows(){
  if(!S.admin) return;
  try{ S.rows=(await Store.list()).filter(r=>r&&r.scores); }catch(e){ toast("Could not load responses."); }
  if(!$("#viewProgram").hidden) renderProgram(); if(!$("#viewIndex").hidden) renderIndex();
}
(async()=>{
  S.admin = !!CONFIG.reviewMode;
  if(S.admin){ $("#tabProgram").hidden=false; $("#tabIndex").hidden=false; }
  try{ const c=await Store.getConfig(); if(c) S.cfg={...DEFAULT_CFG,...c}; }catch(e){}
  try{ S.bench=await Store.getBench(); }catch(e){}
  refreshRows();
})();
$("#tabProgram").addEventListener("click",refreshRows);
$("#tabIndex").addEventListener("click",refreshRows);
</script>
